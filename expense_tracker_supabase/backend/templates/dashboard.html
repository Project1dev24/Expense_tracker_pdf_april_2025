{% extends "base.html" %}

{% block title %}Dashboard - Expense Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Welcome to Your Dashboard</h3>
            </div>
            <div class="card-body text-center">
                <i class="fas fa-user-circle fa-3x mb-3 text-primary"></i>
                <h4>
                    Hello, 
                    {% if user.name %}
                        {{ user.name }}!
                    {% else %}
                        {{ user.email }}!
                    {% endif %}
                </h4>
                <p>You have successfully logged in.</p>
                <div class="mt-4">
                    <a href="{{ url_for('auth.profile') }}" class="btn btn-info me-2">
                        <i class="fas fa-user-edit me-2"></i>Profile
                    </a>
                    <a href="{{ url_for('trips.list_trips') }}" class="btn btn-primary me-2">
                        <i class="fas fa-suitcase me-2"></i>My Trips
                    </a>
                    <a href="{{ url_for('auth.logout') }}" class="btn btn-danger">
                        <i class="fas fa-sign-out-alt me-2"></i>Logout
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
