{% extends "base.html" %} {% block title %}Profile - Expense Tracker{% endblock
%} {% block content %}
<div class="max-w-md mx-auto mt-8">
    <div class="card shadow-xl">
        <div class="px-6 py-8">
            <div class="text-center mb-6">
                <h3 class="text-2xl font-bold">Your Profile</h3>
            </div>

            <form method="POST" class="space-y-6">
                <div>
                    <label for="name" class="block text-sm font-medium mb-2"
                        >Full Name</label
                    >
                    <input
                        type="text"
                        class="block w-full py-3 px-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                        id="name"
                        name="name"
                        value="{{ profile.name if profile and profile.name else '' }}"
                        required
                        placeholder="Enter your full name"
                    />
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium mb-2"
                        >Email Address</label
                    >
                    <input
                        type="email"
                        class="block w-full py-3 px-4 border border-gray-300 rounded-lg bg-gray-100"
                        id="email"
                        name="email"
                        value="{{ user.email if user.email else '' }}"
                        disabled
                    />
                </div>

                <div>
                    <label for="user_id" class="block text-sm font-medium mb-2"
                        >User ID</label
                    >
                    <input
                        type="text"
                        class="block w-full py-3 px-4 border border-gray-300 rounded-lg bg-gray-100"
                        id="user_id"
                        name="user_id"
                        value="{{ user.id if user.id else '' }}"
                        disabled
                    />
                </div>

                <div>
                    <button
                        type="submit"
                        class="btn-primary w-full flex justify-center"
                    >
                        <i class="fas fa-save mr-2"></i>Update Profile
                    </button>
                </div>
            </form>

            <div class="text-center mt-6">
                <a
                    href="{{ url_for('auth.dashboard') }}"
                    class="text-sm text-blue-600 hover:underline"
                    >Back to Dashboard</a
                >
            </div>
        </div>
    </div>
</div>
{% endblock %}
