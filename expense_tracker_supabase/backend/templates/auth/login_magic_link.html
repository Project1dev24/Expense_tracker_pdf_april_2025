{% extends "base.html" %}

{% block title %}Login with Magic Link - Expense Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Login with Magic Link</h3>
            </div>
            <div class="card-body">
                <p class="text-center text-muted">We'll send you a magic link to log in without a password.</p>
                
                <form method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane me-2"></i>Send Magic Link
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-3">
                    <p class="mb-0">
                        or
                    </p>
                </div>
                
                <div class="d-grid mt-3">
                    <a href="{{ url_for('auth.login') }}" class="btn btn-outline-primary">
                        <i class="fas fa-sign-in-alt me-2"></i>Login with Password
                    </a>
                </div>
                
                <div class="text-center mt-3">
                    <p class="mb-0">
                        Don't have an account?
                        <a href="{{ url_for('auth.register') }}">Register</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
