{% extends "base.html" %}

{% block title %}Add Expense - Expense Tracker{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3>Add New Expense</h3>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <input type="text" class="form-control" id="description" name="description" required>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="amount" class="form-label">Amount (₹)</label>
                                <input type="number" class="form-control" id="amount" name="amount" step="0.01" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="currency" class="form-label">Currency</label>
                                <select class="form-control" id="currency" name="currency">
                                    <option value="INR">INR</option>
                                    <option value="USD">USD</option>
                                    <option value="EUR">EUR</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="category" class="form-label">Category</label>
                            <select class="form-control" id="category" name="category">
                                <option value="">Select Category</option>
                                <option value="Food">Food</option>
                                <option value="Transportation">Transportation</option>
                                <option value="Accommodation">Accommodation</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="date" class="form-label">Date</label>
                                <input type="date" class="form-control" id="date" name="date" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="payer_id" class="form-label">Paid By</label>
                                <select class="form-control" id="payer_id" name="payer_id" required>
                                    <option value="{{ user.id }}">You</option>
                                    {% for participant in trip.participants %}
                                    <option value="{{ participant }}">Participant {{ participant }}</option>
                                    {% endfor %}
                                    {% for unregistered in unregistered_participants %}
                                    <option value="unregistered_{{ unregistered.name }}">{{ unregistered.name|title }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="split_method" class="form-label">Split Method</label>
                            <select class="form-control" id="split_method" name="split_method">
                                <option value="equal">Equal Split</option>
                                <option value="exact">Exact Amounts</option>
                                <option value="itemized">Itemized</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Participants</label>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="participant_{{ user.id }}" name="participants" value="{{ user.id }}" checked>
                                <label class="form-check-label" for="participant_{{ user.id }}">You</label>
                            </div>
                            {% for participant in trip.participants %}
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="participant_{{ participant }}" name="participants" value="{{ participant }}" checked>
                                <label class="form-check-label" for="participant_{{ participant }}">Participant {{ participant }}</label>
                            </div>
                            {% endfor %}
                            {% for unregistered in unregistered_participants %}
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="unregistered_{{ unregistered.name }}" name="unregistered_participants" value="{{ unregistered.name }}" checked>
                                <label class="form-check-label" for="unregistered_{{ unregistered.name }}">{{ unregistered.name|title }}</label>
                            </div>
                            {% endfor %}
                        </div>
                        
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{{ url_for('trips.view_trip', trip_id=trip.id) }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Add Expense</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
