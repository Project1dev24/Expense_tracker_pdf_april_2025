{% extends "base.html" %} {% block title %}Settings{% endblock %} {% block
styles %}
<style>
    :root {
        --body-bg: #f4f1ea;
        --panel-bg: #ffffff;
        --border-color: #000000;
        --theme-accent-color: #aec6cf; /* Default: Pastel Blue */
        --theme-contrast-color: #000000; /* Default for light accent */
        --secondary-action-color: #85a0aa; /* Default: Darkened Pastel Blue */
        --border-width: 2px;
        --shadow-offset: 5px;
    }

    body {
        background-color: var(--body-bg);
        font-family:
            -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
            Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
            "Segoe UI Symbol";
    }

    h1,
    h2,
    3,
    h4,
    h5,
    h6,
    .fw-bold {
        font-weight: 700 !important;
        color: var(--border-color);
    }

    .btn {
        border: var(--border-width) solid var(--border-color);
        box-shadow: 3px 3px 0px var(--border-color);
        border-radius: 0.5rem;
        font-weight: 700;
        transition: all 0.15s ease-out;
        padding: 0.5rem 1rem;
    }

    .btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 5px 5px 0px var(--border-color);
    }

    .btn:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0px var(--border-color);
    }

    .btn-primary {
        background-color: var(--theme-accent-color);
        color: var(--theme-contrast-color);
        border-color: var(--border-color);
    }
    .btn-primary:hover {
        color: var(--theme-contrast-color);
    }

    .btn-secondary {
        background-color: var(--secondary-action-color);
        color: var(--theme-contrast-color);
        border-color: var(--border-color);
    }
    .btn-secondary:hover {
        color: var(--theme-contrast-color);
    }

    .panel {
        background-color: var(--panel-bg);
        border: var(--border-width) solid var(--border-color);
        border-radius: 1rem;
        box-shadow: var(--shadow-offset) var(--shadow-offset) 0px
            var(--border-color);
        display: flex;
        flex-direction: column;
        overflow: hidden; /* Ensures children conform to rounded corners */
    }

    .panel-header {
        padding: 0.75rem 1.25rem;
        border-bottom: var(--border-width) solid var(--border-color);
        background-color: var(--theme-accent-color);
    }
    .panel-header h5 {
        color: var(--theme-contrast-color);
    }

    .panel-body {
        padding: 1rem;
        flex-grow: 1;
    }

    /* Theme Selector */
    .theme-selector {
        display: flex;
        align-items: center;
        margin-bottom: 1.5rem;
    }
    .theme-dot {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid #fff;
        box-shadow: 0 0 0 1px var(--border-color);
        margin: 0 5px;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .theme-dot:hover,
    .theme-dot.active {
        transform: scale(1.2);
        box-shadow: 0 0 0 2px var(--border-color);
    }
</style>
{% endblock %} {% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="panel">
                <div class="panel-header">
                    <h5 class="fw-bold mb-0">Settings</h5>
                </div>
                <div class="panel-body">
                    <div class="row">
                        <div class="col-md-12">
                            <h6>Theme</h6>
                            <div class="theme-selector">
                                <small class="me-3 fw-bold"
                                    >Select a theme:</small
                                >
                                <button
                                    class="theme-dot"
                                    style="background-color: #aec6cf"
                                    data-color="#AEC6CF"
                                ></button>
                                <button
                                    class="theme-dot"
                                    style="background-color: #b2d8b2"
                                    data-color="#B2D8B2"
                                ></button>
                                <button
                                    class="theme-dot"
                                    style="background-color: #343434"
                                    data-color="#343434"
                                ></button>
                                <button
                                    class="theme-dot"
                                    style="background-color: #f5f5f5"
                                    data-color="#F5F5F5"
                                ></button>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <h6>Change Password</h6>
                            <form
                                method="POST"
                                action="{{ url_for('auth.settings') }}"
                            >
                                <div class="mb-3">
                                    <label
                                        for="current_password"
                                        class="form-label"
                                        >Current Password</label
                                    >
                                    <input
                                        type="password"
                                        class="form-control"
                                        id="current_password"
                                        name="current_password"
                                        required
                                    />
                                </div>

                                <div class="mb-3">
                                    <label for="new_password" class="form-label"
                                        >New Password</label
                                    >
                                    <input
                                        type="password"
                                        class="form-control"
                                        id="new_password"
                                        name="new_password"
                                        required
                                    />
                                </div>

                                <div class="mb-3">
                                    <label
                                        for="confirm_password"
                                        class="form-label"
                                        >Confirm New Password</label
                                    >
                                    <input
                                        type="password"
                                        class="form-control"
                                        id="confirm_password"
                                        name="confirm_password"
                                        required
                                    />
                                </div>

                                <div class="d-flex">
                                    <button
                                        type="submit"
                                        class="btn btn-primary"
                                    >
                                        <i class="fas fa-key me-2"></i>Change
                                        Password
                                    </button>
                                    <a
                                        href="{{ url_for('auth.profile') }}"
                                        class="btn btn-secondary ms-2"
                                    >
                                        <i class="fas fa-times me-2"></i>Cancel
                                    </a>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %} {% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Theme Selector
        const themeSelector = document.querySelector(".theme-selector");
        const themeDots = themeSelector.querySelectorAll(".theme-dot");
        const root = document.documentElement;

        const getContrastColor = (hex) => {
            if (hex.indexOf("#") === 0) {
                hex = hex.slice(1);
            }
            const r = parseInt(hex.slice(0, 2), 16);
            const g = parseInt(hex.slice(2, 4), 16);
            const b = parseInt(hex.slice(4, 6), 16);
            const yiq = (r * 299 + g * 587 + b * 114) / 1000;
            return yiq >= 128 ? "#000000" : "#FFFFFF";
        };

        const darkenColor = (hex, percent) => {
            if (hex.indexOf("#") === 0) {
                hex = hex.slice(1);
            }
            let r = parseInt(hex.slice(0, 2), 16);
            let g = parseInt(hex.slice(2, 4), 16);
            let b = parseInt(hex.slice(4, 6), 16);

            r = Math.floor(r * (1 - percent / 100));
            g = Math.floor(g * (1 - percent / 100));
            b = Math.floor(b * (1 - percent / 100));

            const toHex = (c) => ("0" + c.toString(16)).slice(-2);

            return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
        };

        const applyTheme = (color) => {
            const contrastColor = getContrastColor(color);
            const secondaryColor = darkenColor(color, 15);

            root.style.setProperty("--theme-accent-color", color);
            root.style.setProperty("--theme-contrast-color", contrastColor);
            root.style.setProperty("--secondary-action-color", secondaryColor);

            localStorage.setItem("dashboardThemeColor", color);
            themeDots.forEach((dot) => {
                dot.classList.toggle("active", dot.dataset.color === color);
            });
        };

        themeDots.forEach((dot) => {
            dot.addEventListener("click", (e) => {
                applyTheme(e.target.dataset.color);
            });
        });

        const savedColor = localStorage.getItem("dashboardThemeColor");
        if (savedColor) {
            applyTheme(savedColor);
        } else {
            applyTheme(themeDots[0].dataset.color);
        }
    });
</script>
{% endblock %}
